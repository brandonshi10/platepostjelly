        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        timeZone: { type: string }
        hours: { $ref: '#/components/schemas/PlaceHours' }
        source:
          type: object
          additionalProperties: false
          required: [system, revision, updatedAt, syncedAt]
          properties:
            system: { type: string }
            revision: { type: integer }
            updatedAt: { type: string, format: date-time }
            syncedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PlaceEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, links]
      properties:
        data: { $ref: '#/components/schemas/Place' }
        meta: { $ref: '#/components/schemas/Meta' }
        links:
          type: object
          additionalProperties: false
          required: [self, jellies, directions]
          properties:
            self: { type: string }
            jellies: { type: string }
            directions: { type: string }

    # ---------- jelly feed ----------
    JellyAuthor:
      type: object
      additionalProperties: false
      required: [id, username, displayName, avatarUrl]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }

    JellyFeedItem:
      type: object
      additionalProperties: false
      required:
        - id
        - postType
        - author
        - title
        - summary
        - thumbnailUrl
        - mediaExpiresAt
        - watchUrl
        - postedAt
      properties:
        id: { type: string }
        postType: { type: string }
        author: { $ref: '#/components/schemas/JellyAuthor' }
        title: { type: string }
        summary: { type: string }
        thumbnailUrl: { type: string }
        mediaExpiresAt: { type: string, format: date-time }
        watchUrl: { type: string }
        postedAt: { type: string, format: date-time }

    JellyFeedEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, links]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [jellies, source, sourceStatus]
          properties:
            jellies:
              type: array
              items: { $ref: '#/components/schemas/JellyFeedItem' }
            source: { type: string, enum: [jelly] }
            sourceStatus: { type: string, enum: [live, stale, place_not_linked] }
        meta: { $ref: '#/components/schemas/Meta' }
        links:
          type: object
          additionalProperties: false
          properties: {}

    # ---------- mission list ----------
    MissionAvailability:
      type: object
      additionalProperties: false
      required: [state, startsAt, endsAt, acceptingSubmissions, reasonCode]
