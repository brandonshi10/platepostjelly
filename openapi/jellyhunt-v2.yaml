openapi: 3.1.0
info:
  title: PlatePost JellyHunt Native API
  version: 2.0.0
  description: >
    Native v2 contract for the PlatePost x JellyJelly JellyHunt mission
    system. See docs/superpowers/specs/2026-07-16-platepost-jelly-native-api-v2-design.md
    and docs/superpowers/specs/2026-07-16-jellyhunt-leaderboard-native-integration-design.md
    for the approved design this document implements.
  license:
    name: Proprietary
    identifier: LicenseRef-PlatePost-Proprietary
servers:
  - url: https://platepost.io/api/v2/jellyhunt
security:
  - {}
tags:
  - name: campaign
    description: Campaign configuration, branding, dates, and app links.
  - name: missions
    description: Mission discovery, detail, and place-linked Jelly content.
  - name: places
    description: Reviewed PlatePost place snapshots and Jelly place content.
  - name: participation
    description: Revision-locked mission participation lifecycle.
  - name: submissions
    description: Idempotent submission creation, detail, and status history.
  - name: me
    description: Authenticated subject personal status and history.
  - name: leaderboards
    description: Public current-season and all-time standings.

paths:
  /campaigns/current:
    get:
      operationId: getCurrentCampaign
      tags: [campaign]
      summary: Get the current campaign
      security: []
      responses:
        "200":
          description: The current campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignEnvelope'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /missions:
    get:
      operationId: listMissions
      tags: [missions]
      summary: List missions for map/list discovery
      security:
        - {}
        - jellyMissionToken: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: availability
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: difficulty
          in: query
          schema: { type: string }
        - name: latitude
          in: query
          schema: { type: number }
        - name: longitude
          in: query
          schema: { type: number }
        - name: radiusMeters
          in: query
          schema: { type: integer, minimum: 1 }
        - name: sort
          in: query
          schema: { type: string, enum: [curated, nearby, updated] }
        - name: include
          in: query
          schema: { type: string, enum: [viewer] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: Cursor-paginated mission summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionListEnvelope'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /missions/{missionId}:
    get:
      operationId: getMission
      tags: [missions]
      summary: Get complete mission detail
      security:
        - {}
        - jellyMissionToken: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - name: include
          in: query
          schema: { type: string, enum: [viewer] }
      responses:
        "200":
          description: Mission detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissionDetailEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /missions/{missionId}/jellies:
    get:
      operationId: getMissionJellies
      tags: [missions]
      summary: List public Jellies linked to the mission's canonical place
      security: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: Place-linked Jelly feed for the mission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JellyFeedEnvelope'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "502":
          $ref: '#/components/responses/DependencyInvalidResponse'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /places/{placeId}:
    get:
      operationId: getPlace
      tags: [places]
      summary: Get a reviewed PlatePost place snapshot
      security: []
      parameters:
        - $ref: '#/components/parameters/PlaceId'
      responses:
        "200":
          description: Place detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceEnvelope'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /places/{placeId}/jellies:
    get:
      operationId: getPlaceJellies
      tags: [places]
      summary: List public Jellies linked to a place
      security: []
      parameters:
        - $ref: '#/components/parameters/PlaceId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: Place-linked Jelly feed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JellyFeedEnvelope'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "502":
          $ref: '#/components/responses/DependencyInvalidResponse'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /missions/{missionId}/participation:
    put:
      operationId: startMissionParticipation
      tags: [participation]
      summary: Idempotently start a mission
      security:
        - jellyMissionToken: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartParticipationRequest'
      responses:
        "200":
          description: Exact replay of an already-started participation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationStartEnvelope'
        "201":
          description: Participation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationStartEnvelope'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /participations/{participationId}:
    get:
      operationId: getParticipation
      tags: [participation]
      summary: Get the owner-only immutable participation snapshot
      security:
        - jellyMissionToken: []
      parameters:
        - $ref: '#/components/parameters/ParticipationId'
      responses:
        "200":
          description: Participation detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationDetailEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /missions/{missionId}/submissions:
    post:
      operationId: createMissionSubmission
      tags: [submissions]
      summary: Create an idempotent asynchronous mission submission
      security:
        - jellyMissionToken: []
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 128
            pattern: '^(?:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|[0-9A-HJKMNP-TV-Za-hjkmnp-tv-z]{26})$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
      responses:
        "202":
          description: Submission accepted for asynchronous processing.
          headers:
            Location:
              schema: { type: string }
            Idempotent-Replayed:
              schema: { type: boolean }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreatedEnvelope'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "422":
          $ref: '#/components/responses/UnprocessableEntity'
        "429":
          $ref: '#/components/responses/RateLimited'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /submissions/{submissionId}:
    get:
      operationId: getSubmission
      tags: [submissions]
      summary: Get owner-only submission, review, and reward detail
      security:
        - jellyMissionToken: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        "200":
          description: Submission detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetailEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /submissions/{submissionId}/events:
    get:
      operationId: listSubmissionEvents
      tags: [submissions]
      summary: Get the owner-only submission status timeline
      security:
        - jellyMissionToken: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Submission status timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionEventsEnvelope'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: Get the canonical subject and campaign-level summary
      security:
        - jellyMissionToken: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        "200":
          description: Personal campaign summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /me/missions:
    get:
      operationId: listMyMissions
      tags: [me]
      summary: Get current and historical mission participation
      security:
        - jellyMissionToken: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: participationStatus
          in: query
          schema: { type: string, enum: [not_started, started] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: Personal mission list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMissionsEnvelope'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /me/submissions:
    get:
      operationId: listMySubmissions
      tags: [me]
      summary: Get cursor-paginated submission history
      security:
        - jellyMissionToken: []
      parameters:
        - name: campaignId
          in: query
          schema: { type: string, pattern: '^cam_[0-9A-Za-z]+$' }
        - name: missionId
          in: query
          schema: { type: string, pattern: '^mis_[0-9A-Za-z]+$' }
        - name: submissionStatus
          in: query
          schema: { type: string }
        - name: rewardStatus
          in: query
          schema: { type: string }
        - name: updatedAfter
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: Personal submission history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySubmissionsEnvelope'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /me/events:
    get:
      operationId: listMyEvents
      tags: [me]
      summary: Get an ordered, lightweight polling feed
      security:
        - jellyMissionToken: []
      parameters:
        - name: after
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Personal event feed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyEventsEnvelope'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /leaderboards/current-season:
    get:
      operationId: getCurrentSeasonLeaderboard
      tags: [leaderboards]
      summary: Get public current-campaign standings
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: Current-season leaderboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardEnvelope'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

  /leaderboards/all-time:
    get:
      operationId: getAllTimeLeaderboard
      tags: [leaderboards]
      summary: Get public all-time standings
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        "200":
          description: All-time leaderboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardEnvelope'
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyUnavailable'

components:
  securitySchemes:
    jellyMissionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CampaignId:
      name: campaignId
      in: query
      schema: { type: string, pattern: '^cam_[0-9A-Za-z]+$' }
    MissionId:
      name: missionId
      in: path
      required: true
      schema: { type: string, pattern: '^mis_[0-9A-Za-z]+$' }
    PlaceId:
      name: placeId
      in: path
      required: true
      schema: { type: string, pattern: '^plc_[0-9A-Za-z]+$' }
    ParticipationId:
      name: participationId
      in: path
      required: true
      schema: { type: string, pattern: '^par_[0-9A-Za-z]+$' }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: string, pattern: '^sub_[0-9A-Za-z]+$' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }

  responses:
    BadRequest:
      description: The request was malformed or a cursor was invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication is required or the bearer token is invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The subject is not authorized to perform this action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The resource does not exist or is not visible to this caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnprocessableEntity:
      description: The request is well-formed but semantically invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: An unexpected internal error occurred.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DependencyInvalidResponse:
      description: An upstream dependency returned an invalid response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DependencyUnavailable:
      description: A required dependency is unavailable.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------- shared envelope pieces ----------
    Error:
      type: object
      additionalProperties: false
      required: [error, meta]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            retryable: { type: boolean }
            restartRequired: { type: boolean }
            details:
              type: array
              items: {}
        meta:
          $ref: '#/components/schemas/Meta'

    Meta:
      type: object
      additionalProperties: false
      required: [apiVersion, requestId, generatedAt]
      properties:
        apiVersion: { const: '2.0' }
        requestId: { type: string }
        generatedAt: { type: string, format: date-time }
        catalogRevision: { type: integer }
        leaderboardRevision: { type: integer }
        page:
          $ref: '#/components/schemas/Page'

    Page:
      type: object
      additionalProperties: false
      required: [limit, nextCursor, hasMore]
      properties:
        limit: { type: integer, minimum: 1 }
        nextCursor: { type: ['string', 'null'] }
        hasMore: { type: boolean }

    RewardAmount:
      type: string
      pattern: '^[0-9]+(?:\.[0-9]+)?$'

    RewardTerms:
      type: object
      additionalProperties: false
      required: [amount, token, displayName]
      properties:
        amount: { $ref: '#/components/schemas/RewardAmount' }
        token: { type: string }
        displayName: { type: string }

    CampaignId:
      type: string
      pattern: '^cam_[0-9A-Za-z]+$'
    PlaceId:
      type: string
      pattern: '^plc_[0-9A-Za-z]+$'
    MissionId:
      type: string
      pattern: '^mis_[0-9A-Za-z]+$'
    ParticipationId:
      type: string
      pattern: '^par_[0-9A-Za-z]+$'
    SubmissionId:
      type: string
      pattern: '^sub_[0-9A-Za-z]+$'
    RewardId:
      type: string
      pattern: '^rwd_[0-9A-Za-z]+$'
    EventId:
      type: string
      pattern: '^evt_[0-9A-Za-z]+$'

    # ---------- campaign ----------
    Campaign:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - catalogRevision
        - title
        - shortTitle
        - status
        - startsAt
        - endsAt
        - claimsCloseAt
        - timeZone
        - rewardToken
        - map
        - links
      properties:
        id: { $ref: '#/components/schemas/CampaignId' }
        revision: { type: integer }
        catalogRevision: { type: integer }
        title: { type: string }
        shortTitle: { type: string }
        status: { type: string, enum: [upcoming, active, ended] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        claimsCloseAt: { type: string, format: date-time }
        timeZone: { type: string }
        rewardToken:
          type: object
          additionalProperties: false
          required: [code, displayName]
          properties:
            code: { type: string }
            displayName: { type: string }
        map:
          type: object
          additionalProperties: false
          required: [center, bounds, defaultZoom]
          properties:
            center:
              type: object
              additionalProperties: false
              required: [latitude, longitude]
              properties:
                latitude: { type: number }
                longitude: { type: number }
            bounds:
              type: object
              additionalProperties: false
              required: [south, west, north, east]
              properties:
                south: { type: number }
                west: { type: number }
                north: { type: number }
                east: { type: number }
            defaultZoom: { type: number }
        links:
          type: object
          additionalProperties: false
          required: [rules, iosApp, androidApp, support]
          properties:
            rules: { type: string }
            iosApp: { type: string }
            androidApp: { type: string }
            support: { type: string }

    CampaignEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, links]
      properties:
        data: { $ref: '#/components/schemas/Campaign' }
        meta: { $ref: '#/components/schemas/Meta' }
        links:
          type: object
          additionalProperties: false
          required: [missions]
          properties:
            missions: { type: string }

    # ---------- place ----------
    PlaceHours:
      type: object
      additionalProperties: false
      properties:
        monday: { $ref: '#/components/schemas/HoursIntervals' }
        tuesday: { $ref: '#/components/schemas/HoursIntervals' }
        wednesday: { $ref: '#/components/schemas/HoursIntervals' }
        thursday: { $ref: '#/components/schemas/HoursIntervals' }
        friday: { $ref: '#/components/schemas/HoursIntervals' }
        saturday: { $ref: '#/components/schemas/HoursIntervals' }
        sunday: { $ref: '#/components/schemas/HoursIntervals' }

    HoursIntervals:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [opensAt, closesAt]
        properties:
          opensAt: { type: string }
          closesAt: { type: string }

    PlaceSummary:
      type: object
      additionalProperties: false
      required: [id, jellyPlaceId, name, address, latitude, longitude, timeZone]
      properties:
        id: { $ref: '#/components/schemas/PlaceId' }
        jellyPlaceId: { type: string }
        name: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        timeZone: { type: string }

    Place:
      type: object
      additionalProperties: false
      required:
        - id
        - revision
        - jellyPlaceId
        - name
        - address
        - latitude
        - longitude
        - timeZone
        - hours
        - source
        - updatedAt
      properties:
        id: { $ref: '#/components/schemas/PlaceId' }
