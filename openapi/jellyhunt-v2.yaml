        state: { type: string, enum: [upcoming, available, paused, ended, archived] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        acceptingSubmissions: { type: boolean }
        reasonCode: { type: ['string', 'null'] }

    MissionDisplay:
      type: object
      additionalProperties: false
      required: [category, difficulty, emoji, neighborhood, price, sortOrder]
      properties:
        category: { type: string }
        difficulty: { type: string }
        emoji: { type: string }
        neighborhood: { type: string }
        price: { type: string }
        sortOrder: { type: integer }

    MissionListItemLinks:
      type: object
      additionalProperties: false
      required: [self, start]
      properties:
        self: { type: string }
        start: { type: string }

    ViewerSummary:
      type: object
      additionalProperties: false
      required:
        - participationStatus
        - participationId
        - missionRevision
        - submissionDeadlineAt
        - resubmissionDeadlineAt
        - displayStatus
        - submissionStatus
        - rewardStatus
        - latestSubmissionId
        - startedAt
        - canStart
        - canSubmit
        - canResubmit
        - nextAction
        - publicMessage
        - updatedAt
      properties:
        participationStatus: { type: string, enum: [not_started, started] }
        participationId: { type: ['string', 'null'] }
        missionRevision: { type: ['integer', 'null'] }
        submissionDeadlineAt: { type: ['string', 'null'], format: date-time }
        resubmissionDeadlineAt: { type: ['string', 'null'], format: date-time }
        displayStatus: { $ref: '#/components/schemas/DisplayStatus' }
        submissionStatus: { type: ['string', 'null'] }
        rewardStatus: { type: string }
        latestSubmissionId: { type: ['string', 'null'] }
        startedAt: { type: ['string', 'null'], format: date-time }
        canStart: { type: boolean }
        canSubmit: { type: boolean }
        canResubmit: { type: boolean }
        nextAction: { $ref: '#/components/schemas/NextAction' }
        publicMessage: { type: string }
        updatedAt: { type: ['string', 'null'], format: date-time }

    DisplayStatus:
      type: string
      enum:
        - not_started
        - in_progress
        - submitted
        - under_review
        - approved_reward_pending
        - rewarded
        - rewarded_removed_from_rankings
        - rejected
        - support_needed

    NextAction:
      type: string
      enum:
        - start_mission
        - publish_jelly
        - submit_post
        - wait_for_verification
        - wait_for_review
        - wait_for_reward
        - view_reward
        - submit_new_post
        - contact_support
        - none

    MissionListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - campaignId
        - revision
        - title
        - availability
        - reward
        - display
        - place
        - links
        - updatedAt
      properties:
        id: { $ref: '#/components/schemas/MissionId' }
        campaignId: { $ref: '#/components/schemas/CampaignId' }
        revision: { type: integer }
        title: { type: string }
        availability: { $ref: '#/components/schemas/MissionAvailability' }
        reward: { $ref: '#/components/schemas/RewardTerms' }
        display: { $ref: '#/components/schemas/MissionDisplay' }
        place: { $ref: '#/components/schemas/PlaceSummary' }
        viewer: { $ref: '#/components/schemas/ViewerSummary' }
        links: { $ref: '#/components/schemas/MissionListItemLinks' }
        updatedAt: { type: string, format: date-time }

    MissionListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [missions]
          properties:
            missions:
              type: array
              items: { $ref: '#/components/schemas/MissionListItem' }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------- mission detail ----------
    MissionRequirements:
      type: object
      additionalProperties: false
      required: [post, place, location, schedule, resubmission]
      properties:
        post:
          type: object
          additionalProperties: false
          required:
            - allowedPostTypes
            - authorshipPolicy
            - prompt
            - minDurationSeconds
            - maxDurationSeconds
            - requiredVisibility
          properties:
            allowedPostTypes:
              type: array
              items: { type: string }
            authorshipPolicy: { type: string }
            prompt: { type: string }
            minDurationSeconds: { type: number }
            maxDurationSeconds: { type: number }
            requiredVisibility: { type: string }
        place:
          type: object
          additionalProperties: false
          required: [attachmentRequired]
          properties:
            attachmentRequired: { type: boolean }
        location:
          type: object
          additionalProperties: false
          required: [required, trustedSource]
          properties:
            required: { type: boolean }
            trustedSource: { type: string }
        schedule:
          type: object
          additionalProperties: false
          required: [mustBeWithinMissionWindow, mustBeDuringVenueHours]
          properties:
            mustBeWithinMissionWindow: { type: boolean }
            mustBeDuringVenueHours: { type: boolean }
        resubmission:
          type: object
          additionalProperties: false
          required: [allowedAfterRejection, maxAttempts]
          properties:
            allowedAfterRejection: { type: boolean }
            maxAttempts: { type: integer }

    MissionDetailLinks:
      type: object
      additionalProperties: false
      required: [self, participation, jellies, start, directions]
      properties:
        self: { type: string }
        participation: { type: ['string', 'null'] }
        jellies: { type: string }
        start: { type: string }
        directions: { type: string }

    Mission:
      type: object
      additionalProperties: false
      required:
        - id
        - campaignId
        - slug
        - revision
        - title
        - description
        - instructions
        - availability
        - reward
        - requirements
        - display
        - place
        - links
        - updatedAt
      properties:
        id: { $ref: '#/components/schemas/MissionId' }
        campaignId: { $ref: '#/components/schemas/CampaignId' }
        slug: { type: string }
        revision: { type: integer }
        title: { type: string }
        description: { type: string }
        instructions:
          type: array
          items: { type: string }
        availability: { $ref: '#/components/schemas/MissionAvailability' }
        reward: { $ref: '#/components/schemas/RewardTerms' }
        requirements: { $ref: '#/components/schemas/MissionRequirements' }
        display: { $ref: '#/components/schemas/MissionDisplay' }
        place:
          type: object
          additionalProperties: false
          required: [id, jellyPlaceId, name, address, latitude, longitude, timeZone, hours]
          properties:
            id: { $ref: '#/components/schemas/PlaceId' }
            jellyPlaceId: { type: string }
            name: { type: string }
            address: { type: string }
            latitude: { type: number }
            longitude: { type: number }
            timeZone: { type: string }
            hours: { $ref: '#/components/schemas/PlaceHours' }
        viewer: { $ref: '#/components/schemas/ViewerSummary' }
        links: { $ref: '#/components/schemas/MissionDetailLinks' }
        updatedAt: { type: string, format: date-time }

    MissionDetailEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, links]
      properties:
        data: { $ref: '#/components/schemas/Mission' }
        meta: { $ref: '#/components/schemas/Meta' }
        links:
          type: object
          additionalProperties: false
          properties: {}

    # ---------- participation ----------
    StartParticipationRequest:
      type: object
      additionalProperties: false
      required: [expectedMissionRevision]
      properties:
        expectedMissionRevision: { type: integer }

    ParticipationStart:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - missionId
        - missionRevision
        - jellyPlaceId
        - startedAt
        - submissionDeadlineAt
        - resubmissionDeadlineAt
        - canStart
        - canSubmit
        - canResubmit
      properties:
        id: { $ref: '#/components/schemas/ParticipationId' }
        status: { type: string, enum: [started] }
        missionId: { $ref: '#/components/schemas/MissionId' }
        missionRevision: { type: integer }
        jellyPlaceId: { type: string }
        startedAt: { type: string, format: date-time }
        submissionDeadlineAt: { type: string, format: date-time }
        resubmissionDeadlineAt: { type: ['string', 'null'], format: date-time }
        canStart: { type: boolean }
        canSubmit: { type: boolean }
        canResubmit: { type: boolean }

    ParticipationStartEnvelope:
      type: object
      additionalProperties: false
      required: [data, links]
      properties:
        data: { $ref: '#/components/schemas/ParticipationStart' }
        meta: { $ref: '#/components/schemas/Meta' }
        links:
          type: object
          additionalProperties: false
          required: [self]
          properties:
            self: { type: string }

    ParticipationTerms:
      type: object
      additionalProperties: false
      required:
        - title
        - description
        - instructions
        - missionWindow
        - reward
        - requirements
        - place
      properties:
        title: { type: string }
        description: { type: string }
        instructions:
          type: array
          items: { type: string }
        missionWindow:
          type: object
          additionalProperties: false
          required: [startsAt, endsAt]
          properties:
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
        reward: { $ref: '#/components/schemas/RewardTerms' }
        requirements: { $ref: '#/components/schemas/MissionRequirements' }
        place:
          type: object
          additionalProperties: false
          required: [id, jellyPlaceId, name, address, latitude, longitude, timeZone]
          properties:
            id: { $ref: '#/components/schemas/PlaceId' }
            jellyPlaceId: { type: string }
            name: { type: string }
            address: { type: string }
            latitude: { type: number }
            longitude: { type: number }
            timeZone: { type: string }

    ParticipationDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - missionId
        - missionRevision
        - isCurrentMissionRevision
        - startedAt
        - submissionDeadlineAt
        - resubmissionDeadlineAt
        - attemptsUsed
        - maxAttempts
        - latestSubmissionId
        - terms
        - currentControls
        - canStart
        - canSubmit
        - canResubmit
        - nextAction
        - publicMessage
        - updatedAt
      properties:
        id: { $ref: '#/components/schemas/ParticipationId' }
        status: { type: string, enum: [started, expired, replaced] }
        missionId: { $ref: '#/components/schemas/MissionId' }
        missionRevision: { type: integer }
        isCurrentMissionRevision: { type: boolean }
        startedAt: { type: string, format: date-time }
        submissionDeadlineAt: { type: string, format: date-time }
        resubmissionDeadlineAt: { type: ['string', 'null'], format: date-time }
        attemptsUsed: { type: integer }
        maxAttempts: { type: integer }
        latestSubmissionId: { type: ['string', 'null'] }
        terms: { $ref: '#/components/schemas/ParticipationTerms' }
        currentControls:
          type: object
          additionalProperties: false
          required: [acceptingSubmissions, reasonCode]
          properties:
            acceptingSubmissions: { type: boolean }
            reasonCode: { type: ['string', 'null'] }
        canStart: { type: boolean }
        canSubmit: { type: boolean }
        canResubmit: { type: boolean }
        nextAction: { $ref: '#/components/schemas/NextAction' }
        publicMessage: { type: string }
        updatedAt: { type: string, format: date-time }

    ParticipationDetailEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, links]
      properties:
        data: { $ref: '#/components/schemas/ParticipationDetail' }
        meta: { $ref: '#/components/schemas/Meta' }
        links:
          type: object
          additionalProperties: false
          required: [mission, latestSubmission]
          properties:
            mission: { type: string }
            latestSubmission: { type: ['string', 'null'] }

    # ---------- submission creation ----------
    ClientLocation:
      type: object
      additionalProperties: false
      required: [latitude, longitude, accuracyMeters, capturedAt]
      properties:
        latitude: { type: number }
        longitude: { type: number }
        accuracyMeters: { type: number }
        capturedAt: { type: string, format: date-time }

    CreateSubmissionRequest:
      type: object
      additionalProperties: false
      required: [participationId, missionRevision, jellyPostId]
      properties:
        participationId: { $ref: '#/components/schemas/ParticipationId' }
        missionRevision: { type: integer }
        jellyPostId: { type: string }
        clientLocation: { $ref: '#/components/schemas/ClientLocation' }

    SubmissionReward:
      type: object
      additionalProperties: false
      required: [status, amount, token, transactionId]
      properties:
        status: { type: string, enum: [not_eligible, queued, processing, sent, failed, uncertain] }
        amount: { $ref: '#/components/schemas/RewardAmount' }
        token: { type: string }
        transactionId: { type: ['string', 'null'] }

    JellyPostRef:
      type: object
      additionalProperties: false
      required: [id, watchUrl]
      properties:
        id: { type: string }
        watchUrl: { type: string }

    SubmissionCreated:
      type: object
      additionalProperties: false
      required:
        - id
        - missionId
        - attempt
        - jellyPost
        - submissionStatus
        - reward
        - displayStatus
        - publicMessage
        - canResubmit
        - submittedAt
        - updatedAt
      properties:
        id: { $ref: '#/components/schemas/SubmissionId' }
        missionId: { $ref: '#/components/schemas/MissionId' }
        attempt: { type: integer }
        jellyPost: { $ref: '#/components/schemas/JellyPostRef' }
        submissionStatus: { type: string }
        reward: { $ref: '#/components/schemas/SubmissionReward' }
        displayStatus: { $ref: '#/components/schemas/DisplayStatus' }
        publicMessage: { type: string }
        canResubmit: { type: boolean }
        submittedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SubmissionCreatedEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, links]
      properties:
        data: { $ref: '#/components/schemas/SubmissionCreated' }
        meta: { $ref: '#/components/schemas/Meta' }
        links:
          type: object
          additionalProperties: false
          required: [self, mission, events]
          properties:
            self: { type: string }
            mission: { type: string }
            events: { type: string }

    # ---------- submission detail ----------
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [sequence, type, submissionStatus, rewardStatus, displayStatus, occurredAt]
      properties:
        sequence: { type: integer }
        type: { type: string }
        submissionStatus: { type: string }
        rewardStatus: { type: string }
        displayStatus: { $ref: '#/components/schemas/DisplayStatus' }
        reasonCode: { type: ['string', 'null'] }
        occurredAt: { type: string, format: date-time }

    SubmissionDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - mission
        - attempt
        - jellyPost
        - submissionStatus
        - verification
        - decision
        - reward
        - displayStatus
        - publicMessage
        - canResubmit
        - nextAction
        - timeline
        - submittedAt
        - updatedAt
      properties:
        id: { $ref: '#/components/schemas/SubmissionId' }
        mission:
          type: object
          additionalProperties: false
          required: [id, revision, title]
          properties:
            id: { $ref: '#/components/schemas/MissionId' }
            revision: { type: integer }
            title: { type: string }
        attempt: { type: integer }
        jellyPost: { $ref: '#/components/schemas/JellyPostRef' }
        submissionStatus: { type: string, enum: [submitted, verifying, needs_review, approved, rejected] }
        verification:
          type: object
          additionalProperties: false
          required: [status, attempts, reasonCode, checkedAt]
          properties:
            status: { type: string, enum: [pending, in_progress, complete, unavailable] }
            attempts: { type: integer }
            reasonCode: { type: ['string', 'null'] }
            checkedAt: { type: ['string', 'null'], format: date-time }
        decision:
          type: object
          additionalProperties: false
          required: [status, reasonCode, message, decidedAt]
          properties:
            status: { type: string, enum: [pending, approved, rejected] }
            reasonCode: { type: ['string', 'null'] }
            message: { type: ['string', 'null'] }
            decidedAt: { type: ['string', 'null'], format: date-time }
        reward:
          type: object
          additionalProperties: false
          required: [id, status, amount, token, transactionId, sentAt]
          properties:
            id:
              oneOf:
                - $ref: '#/components/schemas/RewardId'
                - type: 'null'
            status: { type: string, enum: [not_eligible, queued, processing, sent, failed, uncertain] }
            amount: { $ref: '#/components/schemas/RewardAmount' }
            token: { type: string }
            transactionId: { type: ['string', 'null'] }
            sentAt: { type: ['string', 'null'], format: date-time }
        displayStatus: { $ref: '#/components/schemas/DisplayStatus' }
        reasonCode: { type: ['string', 'null'] }
        publicMessage: { type: string }
        canResubmit: { type: boolean }
        nextAction: { $ref: '#/components/schemas/NextAction' }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/TimelineEntry' }
        submittedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SubmissionDetailEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, links]
      properties:
        data: { $ref: '#/components/schemas/SubmissionDetail' }
        meta: { $ref: '#/components/schemas/Meta' }
        links:
          type: object
          additionalProperties: false
          required: [mission, events]
          properties:
            mission: { type: string }
            events: { type: string }

    SubmissionEventsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [events]
          properties:
            events:
              type: array
              items: { $ref: '#/components/schemas/TimelineEntry' }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------- me ----------
    MeEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta, links]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [subject, campaign]
          properties:
            subject:
              type: object
              additionalProperties: false
              required: [jellyUserId]
              properties:
                jellyUserId: { type: string }
            campaign:
              type: object
              additionalProperties: false
              required:
                - id
                - status
                - statusCounts
                - confirmedRewards
                - latestEventSequence
                - updatedAt
              properties:
                id: { $ref: '#/components/schemas/CampaignId' }
                status: { type: string, enum: [upcoming, active, ended] }
                statusCounts:
                  type: object
                  additionalProperties: false
                  required:
                    - notStarted
                    - inProgress
                    - submitted
                    - underReview
                    - approvedRewardPending
                    - rewarded
                    - rejected
                    - supportNeeded
                  properties:
                    notStarted: { type: integer }
                    inProgress: { type: integer }
                    submitted: { type: integer }
                    underReview: { type: integer }
                    approvedRewardPending: { type: integer }
                    rewarded: { type: integer }
                    rejected: { type: integer }
                    supportNeeded: { type: integer }
                confirmedRewards:
                  type: object
                  additionalProperties: false
                  required: [amount, token]
                  properties:
                    amount: { $ref: '#/components/schemas/RewardAmount' }
                    token: { type: string }
                latestEventSequence: { type: integer }
                updatedAt: { type: string, format: date-time }
        meta: { $ref: '#/components/schemas/Meta' }
        links:
          type: object
          additionalProperties: false
          required: [missions, submissions, events]
          properties:
            missions: { type: string }
            submissions: { type: string }
            events: { type: string }

    MyMissionItem:
      type: object
      additionalProperties: false
      required:
        - mission
        - participationStatus
        - participation
        - latestSubmission
        - canStart
        - canSubmit
        - canResubmit
        - nextAction
        - reasonCode
        - publicMessage
        - updatedAt
        - links
      properties:
        mission:
          type: object
          additionalProperties: false
          required: [id, revision, title, availability, reward, display, place]
          properties:
            id: { $ref: '#/components/schemas/MissionId' }
            revision: { type: integer }
            title: { type: string }
            availability:
              type: object
              additionalProperties: false
              required: [state, acceptingSubmissions, reasonCode]
              properties:
                state: { type: string }
                acceptingSubmissions: { type: boolean }
                reasonCode: { type: ['string', 'null'] }
            reward:
              type: object
              additionalProperties: false
              required: [amount, token]
              properties:
                amount: { $ref: '#/components/schemas/RewardAmount' }
                token: { type: string }
            display:
              type: object
              additionalProperties: false
              required: [emoji, category, difficulty, neighborhood]
              properties:
                emoji: { type: string }
                category: { type: string }
                difficulty: { type: string }
                neighborhood: { type: string }
            place:
              type: object
              additionalProperties: false
              required: [id, name, latitude, longitude]
              properties:
                id: { $ref: '#/components/schemas/PlaceId' }
                name: { type: string }
                latitude: { type: number }
                longitude: { type: number }
        participationStatus: { type: string, enum: [not_started, started] }
        participation:
          type: ['object', 'null']
          additionalProperties: false
          required: [id, missionRevision, startedAt, submissionDeadlineAt, resubmissionDeadlineAt]
          properties:
            id: { $ref: '#/components/schemas/ParticipationId' }
            missionRevision: { type: integer }
            startedAt: { type: string, format: date-time }
            submissionDeadlineAt: { type: string, format: date-time }
            resubmissionDeadlineAt: { type: ['string', 'null'], format: date-time }
        latestSubmission:
          type: ['object', 'null']
          additionalProperties: false
          required: [id, attempt, submissionStatus, rewardStatus, displayStatus, updatedAt]
          properties:
            id: { $ref: '#/components/schemas/SubmissionId' }
            attempt: { type: integer }
            submissionStatus: { type: string }
            rewardStatus: { type: string }
            displayStatus: { $ref: '#/components/schemas/DisplayStatus' }
            updatedAt: { type: string, format: date-time }
        canStart: { type: boolean }
        canSubmit: { type: boolean }
        canResubmit: { type: boolean }
        nextAction: { $ref: '#/components/schemas/NextAction' }
        reasonCode: { type: ['string', 'null'] }
        publicMessage: { type: string }
        updatedAt: { type: string, format: date-time }
        links:
          type: object
          additionalProperties: false
          required: [mission, participation, latestSubmission]
          properties:
            mission: { type: string }
            participation: { type: ['string', 'null'] }
            latestSubmission: { type: ['string', 'null'] }

    MyMissionsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [missions]
          properties:
            missions:
              type: array
              items: { $ref: '#/components/schemas/MyMissionItem' }
        meta: { $ref: '#/components/schemas/Meta' }

    MySubmissionItem:
      type: object
      additionalProperties: false
      required:
        - id
        - source
        - attempt
        - participationId
        - mission
        - jellyPost
        - submissionStatus
        - reward
        - displayStatus
        - reasonCode
        - publicMessage
        - canResubmit
        - nextAction
        - submittedAt
        - updatedAt
        - links
      properties:
        id: { $ref: '#/components/schemas/SubmissionId' }
        source: { type: string, enum: [native, legacy] }
        attempt: { type: integer }
        participationId: { type: ['string', 'null'] }
        mission:
          type: object
          additionalProperties: false
          required: [id, revision, title]
          properties:
            id: { $ref: '#/components/schemas/MissionId' }
            revision: { type: integer }
            title: { type: string }
        jellyPost: { $ref: '#/components/schemas/JellyPostRef' }
        submissionStatus: { type: string }
        reward:
          type: object
          additionalProperties: false
          required: [id, status, amount, token, transactionId, sentAt]
          properties:
            id:
              oneOf:
                - $ref: '#/components/schemas/RewardId'
                - type: 'null'
            status: { type: string }
            amount: { $ref: '#/components/schemas/RewardAmount' }
            token: { type: string }
            transactionId: { type: ['string', 'null'] }
            sentAt: { type: ['string', 'null'], format: date-time }
        displayStatus: { $ref: '#/components/schemas/DisplayStatus' }
        reasonCode: { type: ['string', 'null'] }
        publicMessage: { type: string }
        canResubmit: { type: boolean }
        nextAction: { $ref: '#/components/schemas/NextAction' }
        submittedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        links:
          type: object
          additionalProperties: false
          required: [self, events, mission]
          properties:
            self: { type: string }
            events: { type: string }
            mission: { type: string }

    MySubmissionsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [submissions]
          properties:
            submissions:
              type: array
              items: { $ref: '#/components/schemas/MySubmissionItem' }
        meta: { $ref: '#/components/schemas/Meta' }

    MyEventItem:
      type: object
      additionalProperties: false
      required: [id, sequence, type, entity, changes, occurredAt, links]
      properties:
        id: { $ref: '#/components/schemas/EventId' }
        sequence: { type: integer }
        type: { type: string }
        entity:
          type: object
          additionalProperties: false
          required: [type, id, sequence]
          properties:
            type: { type: string }
            id: { type: string }
            sequence: { type: integer }
        changes:
          type: object
          additionalProperties: false
          required:
            - participationStatus
            - submissionStatus
            - rewardStatus
            - displayStatus
            - reasonCode
            - publicMessage
          properties:
            participationStatus: { type: ['string', 'null'] }
            submissionStatus: { type: ['string', 'null'] }
            rewardStatus: { type: ['string', 'null'] }
            displayStatus: { $ref: '#/components/schemas/DisplayStatus' }
            reasonCode: { type: ['string', 'null'] }
            publicMessage: { type: string }
        occurredAt: { type: string, format: date-time }
        links:
          type: object
          additionalProperties: false
          required: [submission]
          properties:
            submission: { type: string }

    MyEventsEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [events]
          properties:
            events:
              type: array
              items: { $ref: '#/components/schemas/MyEventItem' }
        meta: { $ref: '#/components/schemas/Meta' }

    # ---------- leaderboard ----------
    LeaderboardStanding:
      type: object
      additionalProperties: false
      required: [rank, username, approvedMissionCount]
      properties:
        rank: { type: integer }
        username: { type: string }
        approvedMissionCount: { type: integer }

    LeaderboardEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [scope, rankingBasis, standings]
          properties:
            scope: { type: string, enum: [current_season, all_time] }
            rankingBasis: { type: string, enum: [approved_missions] }
            campaign:
              type: object
              additionalProperties: false
              required: [id, title, startsAt, endsAt]
              properties:
                id: { $ref: '#/components/schemas/CampaignId' }
                title: { type: string }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
            startsAt: { type: string, format: date-time }
            standings:
              type: array
              items: { $ref: '#/components/schemas/LeaderboardStanding' }
        meta: { $ref: '#/components/schemas/Meta' }
